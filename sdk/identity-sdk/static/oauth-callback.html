<!DOCTYPE html>
<!-- Canonical pN OAuth popup bridge; keep copies in prism/developer-portal/id-dashboard in sync. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorizing...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Completing authorization...</div>
  </div>

  <script>
    (function () {
      /** Same key as @par-noir/oauth-ui pnOAuthDebug — opt-in via ?pn_debug_oauth=1 on browse app */
      var DEBUG_KEY = 'pn_debug_oauth';
      function oauthDbg(phase, data) {
        try {
          if (localStorage.getItem(DEBUG_KEY) !== '1') return;
          var entry = { t: Date.now(), loc: 'oauth-callback', phase: phase };
          if (data) {
            for (var k in data) {
              if (Object.prototype.hasOwnProperty.call(data, k)) entry[k] = data[k];
            }
          }
          if (!window.__PN_OAUTH_DEBUG__) window.__PN_OAUTH_DEBUG__ = [];
          window.__PN_OAUTH_DEBUG__.push(entry);
          if (window.opener && !window.opener.closed) {
            try {
              if (!window.opener.__PN_OAUTH_DEBUG__) window.opener.__PN_OAUTH_DEBUG__ = [];
              window.opener.__PN_OAUTH_DEBUG__.push(entry);
            } catch (e) {}
          }
        } catch (e) {}
      }

      var BC_NAME = 'par-noir-oauth-v1';
      /** Must match @par-noir/oauth-ui PN_OAUTH_OPENER_WINDOW_NAME */
      var OPENER_WIN_NAME = 'parnoir_oauth_parent_v1';
      var urlParams = new URLSearchParams(window.location.search);
      var pnPopupFlow = urlParams.get('pn_popup') === '1';
      var code = urlParams.get('code');
      var state = urlParams.get('state');
      var error = urlParams.get('error');
      var grantedDataPoints = urlParams.get('granted_data_points');

      oauthDbg('callback_start', {
        hasCode: !!code,
        hasError: !!error,
        pnPopupFlow: pnPopupFlow
      });

      /** Parent origin for postMessage targetOrigin — must match opener, not only this frame. */
      function getOpenerTargetOrigin() {
        var o = window.location.origin;
        try {
          if (window.opener && !window.opener.closed && window.opener.location && window.opener.location.origin) {
            o = window.opener.location.origin;
          }
        } catch (e) {
          /* cross-origin opener: keep this window's origin (same as app when same-site OAuth) */
        }
        return o;
      }

      /**
       * Messaging handoff from API consent via popup window.name.
       * Must match packages/oauth-ui/src/messagingOAuthHandoff.ts
       */
      var MESSAGING_HANDOFF_PREFIX = 'pn_messaging_handoff_v1:';
      var MESSAGING_IDENTITY_HASH_PREFIX = 'pn_messaging_identity_v1:';
      var MESSAGING_HANDOFF_STORAGE = 'pn_messaging_oauth_handoff';
      var MESSAGING_BC_NAME = 'par-noir-messaging-oauth-v1';
      var MESSAGING_IDENTITY_TYPE = 'pn_messaging_identity';
      var MESSAGING_SESSION_TYPE = 'pn_messaging_session';

      function parseMessagingHandoffFromWindowName(name) {
        if (!name || name.indexOf(MESSAGING_HANDOFF_PREFIX) !== 0) return null;
        try {
          var parsed = JSON.parse(name.slice(MESSAGING_HANDOFF_PREFIX.length));
          if (!parsed || parsed.v !== 1) return null;
          if (!parsed.identity && !parsed.session) return null;
          if (parsed.identity) {
            if (
              typeof parsed.identity.encryptedData !== 'string' ||
              typeof parsed.identity.iv !== 'string' ||
              typeof parsed.identity.salt !== 'string'
            ) {
              return null;
            }
          }
          if (parsed.session) {
            if (typeof parsed.session.mlKemSecretKey !== 'string' || !parsed.session.mlKemSecretKey) {
              return null;
            }
          }
          return parsed;
        } catch (e) {
          return null;
        }
      }

      function parseMessagingIdentityFromHash(hash) {
        if (!hash) return null;
        var raw = hash.charAt(0) === '#' ? hash.slice(1) : hash;
        if (raw.indexOf(MESSAGING_IDENTITY_HASH_PREFIX) !== 0) return null;
        try {
          var parsed = JSON.parse(decodeURIComponent(raw.slice(MESSAGING_IDENTITY_HASH_PREFIX.length)));
          if (!parsed || parsed.v !== 1 || !parsed.identity) return null;
          var id = parsed.identity;
          if (
            typeof id.encryptedData !== 'string' ||
            typeof id.iv !== 'string' ||
            typeof id.salt !== 'string'
          ) {
            return null;
          }
          return id;
        } catch (e) {
          return null;
        }
      }

      function mergeMessagingHandoffParts(windowPart, identity) {
        if (!windowPart && !identity) return null;
        return {
          v: 1,
          timestamp: (windowPart && windowPart.timestamp) || Date.now(),
          session: windowPart && windowPart.session,
          identity: identity || (windowPart && windowPart.identity)
        };
      }

      function parseMessagingHandoffFromStorage(raw) {
        if (!raw) return null;
        try {
          var parsed = JSON.parse(raw);
          if (!parsed || parsed.v !== 1) return null;
          if (!parsed.identity && !parsed.session) return null;
          if (parsed.identity) {
            if (
              typeof parsed.identity.encryptedData !== 'string' ||
              typeof parsed.identity.iv !== 'string' ||
              typeof parsed.identity.salt !== 'string'
            ) {
              parsed.identity = undefined;
            }
          }
          if (parsed.session) {
            if (typeof parsed.session.mlKemSecretKey !== 'string' || !parsed.session.mlKemSecretKey) {
              parsed.session = undefined;
            }
          }
          if (!parsed.identity && !parsed.session) return null;
          return parsed;
        } catch (e) {
          return null;
        }
      }

      function collectMessagingHandoffPayload(clearSources) {
        var fromStorage = null;
        try {
          fromStorage = parseMessagingHandoffFromStorage(localStorage.getItem(MESSAGING_HANDOFF_STORAGE));
        } catch (e) {}

        if (fromStorage && (fromStorage.session || fromStorage.identity)) {
          return fromStorage;
        }

        var windowPart = parseMessagingHandoffFromWindowName(window.name);
        var identityFromHash = parseMessagingIdentityFromHash(window.location.hash);
        var payload = mergeMessagingHandoffParts(windowPart, identityFromHash);
        if (!payload && windowPart && windowPart.session) {
          payload = windowPart;
        }
        if (!payload || (!payload.identity && !payload.session)) return null;

        if (clearSources) {
          if (window.name.indexOf(MESSAGING_HANDOFF_PREFIX) === 0) {
            window.name = '';
          }
          if (identityFromHash) {
            try {
              history.replaceState(null, '', window.location.pathname + window.location.search);
            } catch (e) {}
          }
        }
        return payload;
      }

      function enrichHandoffPayload(payload) {
        if (!payload) return null;
        if (payload.session) return payload;
        try {
          var storedRaw = localStorage.getItem(MESSAGING_HANDOFF_STORAGE);
          if (!storedRaw) return payload;
          var stored = JSON.parse(storedRaw);
          if (stored && stored.session) {
            return mergeMessagingHandoffParts(
              { v: 1, timestamp: stored.timestamp || Date.now(), session: stored.session },
              payload.identity || stored.identity || null
            );
          }
        } catch (e) {}
        return payload;
      }

      var messagingHandoffPayload = enrichHandoffPayload(collectMessagingHandoffPayload(false));

      oauthDbg('messaging_handoff_collect', {
        hasPayload: !!messagingHandoffPayload,
        hasIdentity: !!(messagingHandoffPayload && messagingHandoffPayload.identity),
        hasSession: !!(messagingHandoffPayload && messagingHandoffPayload.session)
      });

      (function deliverMessagingHandoff() {
        var payload = messagingHandoffPayload;
        if (!payload) return;

        try {
          localStorage.setItem(MESSAGING_HANDOFF_STORAGE, JSON.stringify(payload));
        } catch (e) {
          console.warn('messaging handoff localStorage failed', e);
        }

        oauthDbg('messaging_handoff_stashed', {
          hasIdentity: !!payload.identity,
          hasSession: !!payload.session
        });

        function postMessagingToBroadcast() {
          try {
            var ch = new BroadcastChannel(MESSAGING_BC_NAME);
            ch.postMessage(payload);
            ch.close();
          } catch (e) {}
        }

        function postMessagingToOpener(targetOrigin) {
          if (!window.opener || window.opener.closed) return;
          if (payload.identity) {
            try {
              window.opener.postMessage(
                { type: MESSAGING_IDENTITY_TYPE, identity: payload.identity },
                targetOrigin
              );
            } catch (e) {
              try {
                window.opener.postMessage(
                  { type: MESSAGING_IDENTITY_TYPE, identity: payload.identity },
                  window.location.origin
                );
              } catch (e2) {}
            }
          }
          if (payload.session) {
            try {
              window.opener.postMessage(
                { type: MESSAGING_SESSION_TYPE, session: payload.session },
                targetOrigin
              );
            } catch (e) {
              try {
                window.opener.postMessage(
                  { type: MESSAGING_SESSION_TYPE, session: payload.session },
                  window.location.origin
                );
              } catch (e2) {}
            }
          }
        }

        var targetOrigin = getOpenerTargetOrigin();
        var delays = [0, 30, 80, 150, 300, 600, 1200, 2000];
        for (var mi = 0; mi < delays.length; mi++) {
          (function (ms) {
            setTimeout(function () {
              postMessagingToBroadcast();
              postMessagingToOpener(targetOrigin);
            }, ms);
          })(delays[mi]);
        }
      })();

      var oauthData = {
        type: 'oauth_callback',
        code: code,
        state: state,
        error: error,
        granted_data_points: grantedDataPoints,
        timestamp: Date.now(),
        messagingHandoff: messagingHandoffPayload || undefined
      };

      var callbackKey = 'pn_oauth_callback_' + Date.now();
      try {
        localStorage.setItem(callbackKey, JSON.stringify(oauthData));
        localStorage.setItem('pn_oauth_pending', 'true');
        localStorage.setItem('pn_oauth_latest_key', callbackKey);
      } catch (e) {
        console.warn('localStorage failed', e);
      }

      function postToBroadcastChannel() {
        try {
          var ch = new BroadcastChannel(BC_NAME);
          ch.postMessage(oauthData);
          ch.close();
        } catch (e) {}
      }

      function postToOpener(targetOrigin) {
        if (!window.opener || window.opener.closed) return;
        try {
          window.opener.postMessage(oauthData, targetOrigin);
        } catch (e) {
          try {
            window.opener.postMessage(oauthData, window.location.origin);
          } catch (e2) {}
        }
      }

      /** Redeliver: storage partition / timing can drop a single postMessage or BC message. */
      function deliverHandshake() {
        var targetOrigin = getOpenerTargetOrigin();
        var delays = [0, 30, 80, 150, 300, 600, 1200, 2000];
        for (var i = 0; i < delays.length; i++) {
          (function (ms) {
            setTimeout(function () {
              postToBroadcastChannel();
              postToOpener(targetOrigin);
            }, ms);
          })(delays[i]);
        }
      }

      function buildResumeUrl() {
        var q = new URLSearchParams(window.location.search);
        q.set('oauth_resume', '1');
        var url = window.location.origin + '/?' + q.toString();
        if (window.location.hash) {
          url += window.location.hash;
        }
        return url;
      }
      var resumeUrl = buildResumeUrl();

      /**
       * When window.opener is null (noopener / COOP), postMessage and partitioned localStorage
       * may not reach the parent. Navigate the opener tab by its window.name instead.
       */
      function tryNavigateNamedOpener() {
        try {
          var w = window.open(resumeUrl, OPENER_WIN_NAME);
          if (w) {
            oauthDbg('named_opener_nav', { ok: true });
            try { w.focus(); } catch (e) {}
            return true;
          }
        } catch (e) {
          oauthDbg('named_opener_nav', { ok: false });
        }
        return false;
      }

      /**
       * Popup OAuth (pn_popup=1): do NOT navigate opener — that breaks startPnOAuthPopup on the parent.
       */
      var handedOffViaOpenerNav = false;
      if (window.opener && !window.opener.closed && pnPopupFlow) {
        deliverHandshake();
      } else if (window.opener && !window.opener.closed) {
        try {
          window.opener.location.replace(resumeUrl);
          handedOffViaOpenerNav = true;
        } catch (e) {
          deliverHandshake();
        }
      } else {
        deliverHandshake();
      }

      oauthDbg('callback_handoff', {
        handedOffViaOpenerNav: handedOffViaOpenerNav,
        hasOpener: !!(window.opener && !window.opener.closed)
      });

      var lackOpener = !window.opener || window.opener.closed;

      function tryClosePopup() {
        var base = handedOffViaOpenerNav ? 400 : 2600;
        for (var i = 1; i <= 20; i++) {
          setTimeout(function () {
            try {
              if (!window.closed) window.close();
            } catch (e) {}
          }, base + i * 150);
        }
      }

      if (handedOffViaOpenerNav) {
        tryClosePopup();
      } else if (lackOpener) {
        if (pnPopupFlow) {
          if (!tryNavigateNamedOpener()) {
            deliverHandshake();
          } else {
            handedOffViaOpenerNav = true;
          }
          tryClosePopup();
        } else {
          window.location.replace(resumeUrl);
        }
      } else {
        tryClosePopup();
      }

      collectMessagingHandoffPayload(true);
    })();
  </script>
</body>
</html>
