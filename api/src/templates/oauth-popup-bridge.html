<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completing sign-in...</title>
  <style>
    body { font-family: system-ui; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .msg { color: #10b981; }
  </style>
</head>
<body>
  <p class="msg">Sign-in complete. Closing...</p>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var error = params.get('error');
      var errorDesc = params.get('error_description');
      var ageShared = params.get('age_shared');
      var redirectUri = params.get('redirect_uri');
      if (!redirectUri) return;
      var appOrigin;
      try { appOrigin = new URL(redirectUri).origin; } catch (e) { return; }
      // Only string fields (parent parseOAuthPayload uses typeof === 'string' checks).
      var oauthData = { type: 'oauth_callback', timestamp: Date.now() };
      if (code) oauthData.code = code;
      if (state) oauthData.state = state;
      if (error) oauthData.error = error;
      if (errorDesc) oauthData.error_description = errorDesc;
      if (ageShared) oauthData.age_shared = ageShared;
      var openerOk = !!(window.opener && !window.opener.closed);
      if (openerOk) {
        // Standard OAuth popup handoff: postMessage to opener only. Do NOT navigate the opener here —
        // that full-page reloads the SPA and races/breaks the parent's startPnOAuthPopup Promise; the
        // parent exchanges the code in the same document (completeViaParentNavigation: false).
        try {
          window.opener.postMessage(oauthData, appOrigin);
        } catch (e) {}
        setTimeout(function () { try { window.close(); } catch (e) {} }, 300);
      } else {
        // Opener missing (cross-origin / noopener / COOP). Do NOT load the SPA root in this window —
        // that only unlocks inside the popup. Redirect to the app's oauth-callback.html with the
        // same query as a normal OAuth redirect; it writes shared-origin localStorage + BroadcastChannel
        // so the parent window's startPnOAuthPopup poll can complete. pn_popup=1 matches
        // oauth-callback.html: lackOpener + pnPopupFlow → close popup only, no SPA navigation.
        try {
          var ru = new URL(redirectUri);
          if (code) ru.searchParams.set('code', code);
          if (state) ru.searchParams.set('state', state);
          if (error) ru.searchParams.set('error', error);
          if (errorDesc) ru.searchParams.set('error_description', errorDesc);
          if (ageShared) ru.searchParams.set('age_shared', ageShared);
          ru.searchParams.set('pn_popup', '1');
          window.location.replace(ru.toString());
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
