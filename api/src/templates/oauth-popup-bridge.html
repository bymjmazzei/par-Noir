<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completing sign-in...</title>
  <style>
    body { font-family: system-ui; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .msg { color: #10b981; }
  </style>
</head>
<body>
  <p class="msg">Sign-in complete. Closing...</p>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var error = params.get('error');
      var errorDesc = params.get('error_description');
      var ageShared = params.get('age_shared');
      var redirectUri = params.get('redirect_uri');
      if (!redirectUri) return;
      var appOrigin;
      try { appOrigin = new URL(redirectUri).origin; } catch (e) { return; }
      var q = new URLSearchParams();
      q.set('oauth_resume', '1');
      if (code) q.set('code', code);
      if (state) q.set('state', state);
      if (error) q.set('error', error);
      if (errorDesc) q.set('error_description', errorDesc);
      if (ageShared) q.set('age_shared', ageShared);
      var resumeUrl = appOrigin + '/?' + q.toString();
      // Only string fields (parent parseOAuthPayload uses typeof === 'string' checks).
      var oauthData = { type: 'oauth_callback', timestamp: Date.now() };
      if (code) oauthData.code = code;
      if (state) oauthData.state = state;
      if (error) oauthData.error = error;
      if (errorDesc) oauthData.error_description = errorDesc;
      if (ageShared) oauthData.age_shared = ageShared;
      var openerOk = !!(window.opener && !window.opener.closed);
      if (openerOk) {
        // Prefer navigating the opener: avoids postMessage vs unload races (postMessage then
        // immediate opener.replace could drop the message before the parent handled it).
        try {
          window.opener.location.replace(resumeUrl);
          setTimeout(function () { try { window.close(); } catch (e) {} }, 300);
          return;
        } catch (e) {
          /* fall through to postMessage */
        }
        try {
          window.opener.postMessage(oauthData, appOrigin);
        } catch (e) {}
        setTimeout(function () { try { window.close(); } catch (e) {} }, 400);
      } else {
        // Last resort: load the app in this window so oauth_resume can run (e.g. opener lost).
        try {
          window.location.replace(resumeUrl);
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
