# ffmpeg: runtime (mediaSamplingService). Keep — required at run, not for compile.
# Large tsc (server.ts ~18k lines): use heap + skip .d.ts in tsconfig.build.json to avoid OOM / "stuck" builds.
#
# Prefer repository-root Nixpacks (`/nixpacks.toml`) so `file:../packages/*` resolves.
# This file applies only when Railway Root Directory is set to `api` (packages must still be in context).
[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "ffmpeg"]

[phases.install]
cmds = ["npm ci --production=false"]

[phases.build]
cmds = ["NODE_OPTIONS=--max-old-space-size=8192 npm run build"]

[start]
cmd = "npm start"

