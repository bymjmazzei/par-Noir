<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorizing...</title>
  <!-- Allow cross-origin communication with opener for OAuth popup -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Completing authorization...</div>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    const error = urlParams.get('error');
    const ageShared = urlParams.get('age_shared');

    const oauthData = {
      type: 'oauth_callback',
      code: code,
      state: state,
      error: error,
      age_shared: ageShared,
      timestamp: Date.now()
    };

    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage(oauthData, window.location.origin);
      } catch (e) {
        console.error('postMessage failed', e);
      }
    }

    document.body.innerHTML = `
      <div style="padding: 40px; text-align: center;">
        <div style="color: #10b981; font-size: 24px; margin-bottom: 16px;">✓ Authorization Complete</div>
        <p style="color: #9ca3af;">You can close this window.</p>
      </div>
    `;

    if (!window.opener || window.opener.closed) {
      window.location.replace(window.location.origin + '/');
    } else {
      for (let i = 1; i <= 15; i++) {
        setTimeout(() => {
          try {
            if (!window.closed) window.close();
          } catch (e) {}
        }, i * 100);
      }
    }
  </script>
</body>
</html>
