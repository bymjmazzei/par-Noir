<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google OAuth Callback</title>
  <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
</head>
<body>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const error = urlParams.get('error');

    if (window.opener && !window.opener.closed) {
      try {
        if (error) {
          window.opener.postMessage({
            type: 'GOOGLE_OAUTH_CODE',
            error: error
          }, window.location.origin);
        } else if (code) {
          window.opener.postMessage({
            type: 'GOOGLE_OAUTH_CODE',
            code: code
          }, window.location.origin);
        } else {
          window.opener.postMessage({
            type: 'GOOGLE_OAUTH_CODE',
            error: 'No authorization code received'
          }, window.location.origin);
        }
        setTimeout(() => {
          window.close();
        }, 100);
      } catch (e) {
        console.error('Error sending message to opener:', e);
        document.body.innerHTML = '<p style="padding: 20px; font-family: Arial;">Error communicating with main window. Please close this window and try again.</p>';
      }
    } else {
      document.body.innerHTML = '<p style="padding: 20px; font-family: Arial;">This window should be closed automatically. If it doesn\'t close, you can close it manually.</p>';
      setTimeout(() => {
        window.close();
      }, 1000);
    }
  </script>
</body>
</html>
