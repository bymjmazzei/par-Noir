<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Par Noir - Digital Identity Management</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Par Noir - Create, manage, and secure your digital identities" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Par Noir" />
    <meta name="msapplication-TileColor" content="#1f2937" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-192x192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-512x512.svg" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.svg" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="/icons/favicon.png" />
    <meta name="msapplication-TileColor" content="#1f2937" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://apis.google.com">
    <link rel="preconnect" href="https://accounts.google.com">
    <link rel="preconnect" href="https://www.googleapis.com">
    <link rel="preconnect" href="https://generativelanguage.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Security Headers for OAuth popups -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
    
    <!-- Content Security Policy - Enhanced Security -->
    <!-- Note: unsafe-inline and unsafe-eval are required for Google OAuth library -->
    <!-- However, we restrict them to only Google domains for better security -->
    <!-- Note: require-trusted-types-for is removed as it conflicts with unsafe-inline/unsafe-eval needed for Google OAuth -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://api.parnoir.com https://apis.google.com https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com https://generativelanguage.googleapis.com wss: ws:;
      frame-src 'self' https://accounts.google.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self' https://accounts.google.com;
      upgrade-insecure-requests;
    ">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Google Drive OAuth Callback Handler (legacy - only for direct redirects, not popups) -->
    <script>
      // Only handle OAuth callback if it's NOT in a popup (oauth-callback.html handles popups)
      // Check if we're the main window and have a code parameter (shouldn't happen, but handle gracefully)
      if (window.location.search.includes('code=') && !window.opener && window.location.pathname === '/') {
        // This shouldn't happen with proper OAuth flow, but redirect to oauth-callback.html
        const currentUrl = new URL(window.location.href);
        currentUrl.pathname = '/oauth-callback.html';
        window.location.href = currentUrl.toString();
      }
    </script>

    <!-- Service Worker Registration (disabled) -->
    <script>
      if (false && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered successfully:', registration.scope);
              
              // Handle service worker updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New service worker available
                    if (confirm('A new version is available. Reload to update?')) {
                      window.location.reload();
                    }
                  }
                });
              });
            })
            .catch((error) => {
              console.error('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
