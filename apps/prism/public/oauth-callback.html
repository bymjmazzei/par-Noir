<!DOCTYPE html>
<!-- Canonical pN OAuth popup bridge; keep copies in prism/developer-portal/id-dashboard in sync. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorizing...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Completing authorization...</div>
  </div>

  <script>
    (function () {
      var BC_NAME = 'par-noir-oauth-v1';
      var urlParams = new URLSearchParams(window.location.search);
      var pnPopupFlow = urlParams.get('pn_popup') === '1';
      var code = urlParams.get('code');
      var state = urlParams.get('state');
      var error = urlParams.get('error');
      var ageShared = urlParams.get('age_shared');

      var oauthData = {
        type: 'oauth_callback',
        code: code,
        state: state,
        error: error,
        age_shared: ageShared,
        timestamp: Date.now()
      };

      var callbackKey = 'pn_oauth_callback_' + Date.now();
      try {
        localStorage.setItem(callbackKey, JSON.stringify(oauthData));
        localStorage.setItem('pn_oauth_pending', 'true');
        localStorage.setItem('pn_oauth_latest_key', callbackKey);
      } catch (e) {
        console.warn('localStorage failed', e);
      }

      try {
        var oauthBc = new BroadcastChannel(BC_NAME);
        oauthBc.postMessage(oauthData);
        oauthBc.close();
      } catch (e) {}

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage(oauthData, window.location.origin);
        } catch (e) {
          console.warn('postMessage failed', e);
        }
      }

      function buildResumeUrl() {
        var q = new URLSearchParams(window.location.search);
        q.set('oauth_resume', '1');
        return window.location.origin + '/?' + q.toString();
      }
      var resumeUrl = buildResumeUrl();

      document.body.innerHTML =
        '<div style="padding: 40px; text-align: center;">' +
        '<div style="color: #10b981; font-size: 24px; margin-bottom: 16px;">✓ Authorization Complete</div>' +
        '<p style="color: #9ca3af;">You can close this window.</p>' +
        '</div>';

      var lackOpener = !window.opener || window.opener.closed;

      function tryClosePopup() {
        for (var i = 1; i <= 20; i++) {
          setTimeout(function () {
            try {
              if (!window.closed) window.close();
            } catch (e) {}
          }, i * 120);
        }
      }

      if (lackOpener) {
        if (pnPopupFlow) {
          tryClosePopup();
        } else {
          window.location.replace(resumeUrl);
        }
      } else {
        tryClosePopup();
      }
    })();
  </script>
</body>
</html>
