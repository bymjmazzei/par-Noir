<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <title>par Noir Content Browser</title>
  <!-- Content Security Policy - Allow images from blob URLs and API -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    font-src 'self' data:;
    img-src 'self' data: https: blob:;
    connect-src 'self' https://api.parnoir.com http://127.0.0.1:* http://localhost:* wss: ws: https://ipfs.infura.io https://gateway.pinata.cloud https://cloudflare-ipfs.com https://dweb.link https://ipfs.io;
    frame-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
</head>
<body>
  <div id="root"></div>
  <!-- Runs before the Vite bundle so DevTools always has these (cache/old bundle can’t strip this). -->
  <script>
    (function () {
      if (typeof window === 'undefined') return;
      var K = 'pn_debug_oauth';
      if (!window.__PN_OAUTH_DEBUG__) window.__PN_OAUTH_DEBUG__ = [];
      window.pnOAuthDebugStatus = function () {
        try {
          return localStorage.getItem(K) === '1' ? 'on' : 'off';
        } catch (e) {
          return 'off';
        }
      };
      window.pnOAuthDebugCopy = function () {
        var log = window.__PN_OAUTH_DEBUG__ || [];
        var s = JSON.stringify(log, null, 2);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(s);
          }
        } catch (e) {}
        return s;
      };
      /** Turn OAuth step logging on (persists) and reload — no need to remember ?pn_debug_oauth=1 */
      window.pnOAuthDebugOn = function () {
        try {
          localStorage.setItem(K, '1');
        } catch (e) {
          return 'failed: ' + e;
        }
        location.reload();
      };
      window.pnOAuthDebugOff = function () {
        try {
          localStorage.removeItem(K);
          if (window.__PN_OAUTH_DEBUG__) window.__PN_OAUTH_DEBUG__.length = 0;
        } catch (e) {
          return 'failed: ' + e;
        }
        location.reload();
      };
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
