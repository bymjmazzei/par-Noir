<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>par Noir Content Browser</title>
  <!-- Content Security Policy - Allow images from blob URLs and API -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    font-src 'self' data:;
    img-src 'self' data: https: blob:;
    connect-src 'self' https://api.parnoir.com http://127.0.0.1:* http://localhost:* wss: ws:;
    frame-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
