<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorizing...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    
    .container {
      text-align: center;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Completing authorization...</div>
  </div>
  
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    const error = urlParams.get('error');
    const ageShared = urlParams.get('age_shared');
    
    console.log('oauth-callback.html loaded', { code: !!code, state, error, ageShared });
    
    const oauthData = {
      type: 'oauth_callback',
      code: code,
      state: state,
      error: error,
      age_shared: ageShared,
      timestamp: Date.now()
    };
    
    const callbackKey = `pn_oauth_callback_${Date.now()}`;
    try {
      localStorage.setItem(callbackKey, JSON.stringify(oauthData));
      localStorage.setItem('pn_oauth_pending', 'true');
      localStorage.setItem('pn_oauth_latest_key', callbackKey);
    } catch (e) {
      console.warn('localStorage failed', e);
    }
    
    function buildResumeUrl() {
      const q = new URLSearchParams(window.location.search);
      q.set('oauth_resume', '1');
      return window.location.origin + '/?' + q.toString();
    }
    
    const resumeUrl = buildResumeUrl();
    
    // Desktop: postMessage to opener (when it works)
    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage(oauthData, window.location.origin);
        console.log('postMessage sent to opener');
      } catch (e) {
        console.warn('postMessage failed', e);
      }
      // Capacitor / Android WebView: opener often never receives postMessage; localStorage in popup
      // is not shared with the main WebView. Navigate the main app with the code in the URL.
      try {
        window.opener.location.replace(resumeUrl);
        console.log('Navigated opener to app with oauth_resume');
      } catch (e) {
        console.warn('opener.location.replace failed', e);
      }
    }
    
    document.body.innerHTML = `
      <div style="padding: 40px; text-align: center;">
        <div style="color: #10b981; font-size: 24px; margin-bottom: 16px;">✓ Authorization Complete</div>
        <p style="color: #9ca3af;">You can close this window.</p>
      </div>
    `;
    
    // Same-window flow (e.g. full-page OAuth on native): load SPA with params
    if (!window.opener || window.opener.closed) {
      window.location.replace(resumeUrl);
    } else {
      for (let i = 1; i <= 15; i++) {
        setTimeout(() => {
          try {
            if (!window.closed) window.close();
          } catch (e) {}
        }, i * 100);
      }
    }
  </script>
</body>
</html>
