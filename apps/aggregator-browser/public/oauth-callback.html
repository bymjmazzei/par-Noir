<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorizing...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    
    .container {
      text-align: center;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Completing authorization...</div>
  </div>
  
  <script>
    // This page handles OAuth callback redirects
    // Extract code from URL and send to parent window
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    const error = urlParams.get('error');
    
    console.log('oauth-callback.html loaded', { code, state, error, hasOpener: !!window.opener });
    
    // Try multiple methods to find the opener window
    let openerWindow = window.opener;
    
    // If opener is null, try window.parent (for iframes)
    if (!openerWindow || openerWindow.closed) {
      openerWindow = window.parent !== window ? window.parent : null;
    }
    
    // If still no opener, try to find it via window.name or other methods
    if (!openerWindow || openerWindow.closed) {
      // Try to access via window.top if we're in a frame
      if (window.top !== window) {
        openerWindow = window.top.opener || null;
      }
    }
    
    console.log('Found opener window:', !!openerWindow, openerWindow ? !openerWindow.closed : 'N/A');
    
    if (openerWindow && !openerWindow.closed) {
      console.log('Sending message to opener...');
      try {
        const message = {
          type: 'oauth_callback',
          code: code,
          state: state,
          error: error
        };
        console.log('Posting message:', message, 'to origin:', window.location.origin);
        openerWindow.postMessage(message, window.location.origin);
        console.log('Message sent successfully!');
      } catch (e) {
        console.error('Failed to send message:', e);
      }
    } else {
      console.warn('No opener found - this should not happen in popup mode');
      // Fallback: try to redirect opener if we can access it
      try {
        if (window.opener) {
          window.opener.location.href = `/?code=${code || ''}&state=${state || ''}&error=${error || ''}`;
        }
      } catch (e) {
        console.error('Cannot redirect opener:', e);
      }
    }
    
    // ALWAYS try to close the popup, regardless of whether message was sent
    console.log('Attempting to close popup...');
    window.close();
    
    // Multiple close attempts
    setTimeout(() => {
      if (!window.closed) {
        console.log('Close attempt 1');
        window.close();
      }
    }, 50);
    
    setTimeout(() => {
      if (!window.closed) {
        console.log('Close attempt 2');
        window.close();
      }
    }, 100);
    
    setTimeout(() => {
      if (!window.closed) {
        console.log('Close attempt 3 - popup may be blocked by browser');
        // Last resort: show message to user
        document.body.innerHTML = '<div style="padding: 20px; text-align: center;"><p>Authorization complete! You can close this window.</p></div>';
      }
    }, 500);
  </script>
</body>
</html>
