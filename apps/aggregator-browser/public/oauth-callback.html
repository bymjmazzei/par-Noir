<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorizing...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    
    .container {
      text-align: center;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Completing authorization...</div>
  </div>
  
  <script>
    // This page handles OAuth callback redirects
    // Extract code from URL and send to parent window
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    const error = urlParams.get('error');
    
    console.log('oauth-callback.html loaded', { code, state, error, hasOpener: !!window.opener });
    
    // Use localStorage event to communicate with main window (works even if window.opener is lost)
    const oauthData = {
      type: 'oauth_callback',
      code: code,
      state: state,
      error: error,
      timestamp: Date.now()
    };
    
    console.log('Storing OAuth data in localStorage:', oauthData);
    localStorage.setItem('pn_oauth_callback', JSON.stringify(oauthData));
    
    // Trigger storage event manually (some browsers don't fire it for same-tab writes)
    // The main window will listen for this
    window.dispatchEvent(new StorageEvent('storage', {
      key: 'pn_oauth_callback',
      newValue: JSON.stringify(oauthData),
      oldValue: null
    }));
    
    // Also try postMessage as fallback
    if (window.opener && !window.opener.closed) {
      console.log('Sending message via postMessage...');
      try {
        window.opener.postMessage(oauthData, window.location.origin);
        console.log('Message sent via postMessage');
      } catch (e) {
        console.error('postMessage failed:', e);
      }
    }
    
    // Try to close popup
    console.log('Attempting to close popup...');
    window.close();
    
    // Multiple close attempts
    setTimeout(() => {
      if (!window.closed) {
        console.log('Close attempt 1');
        window.close();
      }
    }, 50);
    
    setTimeout(() => {
      if (!window.closed) {
        console.log('Close attempt 2');
        window.close();
      }
    }, 100);
    
    setTimeout(() => {
      if (!window.closed) {
        console.log('Close attempt 3');
        window.close();
      }
    }, 200);
    
    setTimeout(() => {
      if (!window.closed) {
        console.log('Popup still open - showing close message');
        document.body.innerHTML = '<div style="padding: 20px; text-align: center;"><p style="color: white;">Authorization complete! You can close this window.</p></div>';
      }
    }, 500);
  </script>
</body>
</html>
