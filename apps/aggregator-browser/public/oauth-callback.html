<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorizing...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    
    .container {
      text-align: center;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Completing authorization...</div>
  </div>
  
  <script>
    // This page handles OAuth callback redirects
    // Extract code from URL
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    const error = urlParams.get('error');
    const ageShared = urlParams.get('age_shared'); // Age sharing preference from consent screen
    
    console.log('oauth-callback.html loaded', { code, state, error, ageShared });
    
    // Store in localStorage with unique key to avoid conflicts
    const callbackKey = `pn_oauth_callback_${Date.now()}`;
    const oauthData = {
      type: 'oauth_callback',
      code: code,
      state: state,
      error: error,
      age_shared: ageShared, // Include age sharing preference
      timestamp: Date.now()
    };
    
    console.log('Storing OAuth callback:', callbackKey, oauthData);
    localStorage.setItem(callbackKey, JSON.stringify(oauthData));
    
    // Also set a flag that main window is polling for
    localStorage.setItem('pn_oauth_pending', 'true');
    localStorage.setItem('pn_oauth_latest_key', callbackKey);
    
    // Try postMessage if opener exists
    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage(oauthData, window.location.origin);
        console.log('Message sent via postMessage');
      } catch (e) {
        console.error('postMessage failed:', e);
      }
    }
    
    // Show success message and try to close
    document.body.innerHTML = `
      <div style="padding: 40px; text-align: center;">
        <div style="color: #10b981; font-size: 24px; margin-bottom: 16px;">✓ Authorization Complete</div>
        <p style="color: #9ca3af;">You can close this window.</p>
      </div>
    `;
    
    // Try to close immediately
    window.close();
    
    // Multiple close attempts
    for (let i = 1; i <= 10; i++) {
      setTimeout(() => {
        if (!window.closed) {
          window.close();
        }
      }, i * 100);
    }
  </script>
</body>
</html>
