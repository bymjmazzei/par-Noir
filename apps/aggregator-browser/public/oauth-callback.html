<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorizing...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    
    .container {
      text-align: center;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Completing authorization...</div>
  </div>
  
  <script>
    // This page handles OAuth callback redirects
    // Extract code from URL and send to parent window
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    const error = urlParams.get('error');
    
    console.log('oauth-callback.html loaded', { code, state, error, hasOpener: !!window.opener });
    
    // Always try to send message to opener and close popup
    if (window.opener && !window.opener.closed) {
      console.log('Sending message to opener...');
      try {
        const message = {
          type: 'oauth_callback',
          code: code,
          state: state,
          error: error
        };
        console.log('Posting message:', message);
        window.opener.postMessage(message, window.location.origin);
        console.log('Message sent, closing popup...');
        
        // Close popup immediately - don't wait
        window.close();
        
        // Force close after a short delay if still open
        setTimeout(() => {
          if (!window.closed) {
            console.log('Popup still open, forcing close...');
            window.close();
          }
        }, 100);
      } catch (e) {
        console.error('Failed to send message:', e);
        // Still try to close
        window.close();
        setTimeout(() => {
          if (!window.closed) {
            window.close();
          }
        }, 100);
      }
    } else {
      console.log('No opener, redirecting to main app');
      // If no opener, redirect to main app (not in popup)
      window.location.href = '/';
    }
  </script>
</body>
</html>
