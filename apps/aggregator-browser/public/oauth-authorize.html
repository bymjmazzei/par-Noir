<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>par Noir — Redirecting</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; text-align: center; color: #111; }
    a { color: #0a66c2; }
  </style>
</head>
<body>
  <p>OAuth unlock uses the shared API consent page. Redirecting…</p>
  <p id="fallback" style="display:none">If you are not redirected, <a id="link" href="#">open consent</a>.</p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var api = (params.get('api_endpoint') || 'https://api.parnoir.com').replace(/\/$/, '');
      var clientId = params.get('client_id') || 'browser-app';
      var redirectUri = params.get('redirect_uri') || (window.location.origin + '/oauth-callback.html');
      var q = new URLSearchParams({
        client_id: clientId,
        redirect_uri: redirectUri,
        response_type: 'code',
        scope: params.get('scope') || 'openid profile',
      });
      if (params.get('state')) q.set('state', params.get('state'));
      if (params.get('nonce')) q.set('nonce', params.get('nonce'));
      if (params.get('popup') === 'true') q.set('popup', 'true');
      if (params.get('identity_handoff') === 'required') q.set('identity_handoff', 'required');
      var url = api + '/oauth/authorize/consent?' + q.toString();
      document.getElementById('link').href = url;
      document.getElementById('fallback').style.display = 'block';
      window.location.replace(url);
    })();
  </script>
</body>
</html>
