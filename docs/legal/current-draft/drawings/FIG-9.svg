<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792"
     viewBox="0 0 612 792" version="1.1">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="612" height="792" fill="#fff"/>
  <text x="28" y="26" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000">FIG. 9</text>
  <text x="100" y="26" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000">User cloud folder layout</text>
  <line x1="28" y1="34" x2="584" y2="34" stroke="#000" stroke-width="1"/>
  <text x="50" y="60" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold">par Noir - {pnIdentifier}/</text>
  <text x="74" y="96" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ _metadata/</text>
  <text x="98" y="128" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ profile.json</text>
  <text x="98" y="160" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ public-file-index.xlsx</text>
  <text x="378" y="160" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">112</text>
  <text x="98" y="192" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ owner-file-index.xlsx</text>
  <text x="98" y="224" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ recovery.xlsx</text>
  <text x="378" y="224" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">400</text>
  <text x="98" y="256" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ zkp-data-points.xlsx</text>
  <text x="98" y="288" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ third-party-permissions.xlsx</text>
  <text x="98" y="320" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ integrators/{oauth_client_id}/</text>
  <text x="74" y="352" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ media/  thoughts/  collections/</text>
  <text x="98" y="384" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ *-public-index.xlsx</text>
  <text x="74" y="424" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ par-noir-messages/  (on demand)</text>
  <text x="98" y="456" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ _outbox/  (sender durable commit)</text>
  <text x="98" y="488" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal">└─ conversation-*.xlsx</text>
  <text x="50" y="560" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic">Public index 112 is absolute authority for feed membership.</text>
  <text x="50" y="584" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic">Peer materialization is recipient-device (no cross-user Drive write).</text>
</svg>
