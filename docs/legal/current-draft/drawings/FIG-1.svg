<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792"
     viewBox="0 0 612 792" version="1.1">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="612" height="792" fill="#fff"/>
  <text x="28" y="26" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000">FIG. 1</text>
  <text x="100" y="26" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000">System architecture</text>
  <line x1="28" y1="34" x2="584" y2="34" stroke="#000" stroke-width="1"/>

  <!-- USER SIDE: numerals inside each component box (left), clear of outer border -->
  <rect x="72" y="48" width="190" height="250" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="80" y="66" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" font-style="italic">User side</text>

  <rect x="84" y="76" width="166" height="32" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="92" y="96" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">100</text>
  <text x="180" y="96" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">User device</text>

  <rect x="84" y="120" width="166" height="32" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="92" y="140" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">102</text>
  <text x="180" y="140" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">pN client</text>

  <rect x="84" y="164" width="166" height="38" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="92" y="186" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">104</text>
  <text x="180" y="180" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Portable identity</text>
  <text x="180" y="194" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">file (.pn)</text>

  <rect x="84" y="214" width="166" height="42" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="92" y="238" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">106</text>
  <text x="180" y="232" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Sealed cloud</text>
  <text x="180" y="246" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">credentials</text>

  <line x1="167" y1="108" x2="167" y2="120" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="167" y1="152" x2="167" y2="164" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="167" y1="202" x2="167" y2="214" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- OPERATOR -->
  <rect x="390" y="48" width="175" height="250" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="398" y="66" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" font-style="italic">Operator-hosted</text>

  <rect x="404" y="76" width="147" height="38" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="477" y="92" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Coordinating</text>
  <text x="477" y="106" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">API server</text>
  <text x="582" y="96" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">120</text>

  <rect x="404" y="130" width="147" height="32" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="477" y="150" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">OAuth client registry</text>
  <text x="582" y="150" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">122</text>

  <rect x="404" y="178" width="147" height="38" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="477" y="194" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Membership</text>
  <text x="477" y="208" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">alignment</text>
  <text x="582" y="200" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">124</text>

  <rect x="404" y="232" width="147" height="32" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="477" y="252" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Aggregator cache DB</text>
  <text x="582" y="252" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">130</text>

  <line x1="477" y1="114" x2="477" y2="130" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="477" y1="162" x2="477" y2="178" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="477" y1="216" x2="477" y2="232" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- Cloud under user -->
  <rect x="72" y="330" width="190" height="42" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="80" y="352" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">110</text>
  <text x="180" y="347" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">User-controlled</text>
  <text x="180" y="361" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">cloud storage</text>

  <rect x="72" y="392" width="190" height="32" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="80" y="412" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">112</text>
  <text x="180" y="412" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Public index</text>
  <line x1="167" y1="372" x2="167" y2="392" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- Forwarded AT: 106 -> API -->
  <polyline points="250,235 275,235 275,95 404,95"
            fill="none" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="280" y="118" width="100" height="50" fill="#fff" stroke="#000" stroke-width="0.5"/>
  <text x="284" y="132" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">forwarded AT</text>
  <text x="284" y="144" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">(no long-lived</text>
  <text x="284" y="156" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">cloud secrets</text>
  <text x="284" y="168" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">on API)</text>

  <!-- Owner Drive I/O -->
  <polyline points="404,248 325,248 325,351 262,351"
            fill="none" stroke="#000" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="264" y="300" width="72" height="14" fill="#fff" stroke="none"/>
  <text x="266" y="311" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">owner Drive I/O</text>

  <!-- Browser / integrator -->
  <rect x="72" y="460" width="190" height="40" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="80" y="484" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">140</text>
  <text x="180" y="476" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Aggregator</text>
  <text x="180" y="490" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">browser</text>

  <rect x="390" y="460" width="175" height="40" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="477" y="476" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Third-party</text>
  <text x="477" y="490" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">integrator</text>
  <text x="582" y="484" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">150</text>

  <!-- Feed queries -->
  <polyline points="262,480 360,480 360,112 404,112"
            fill="none" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="268" y="432" width="58" height="14" fill="#fff" stroke="none"/>
  <text x="270" y="443" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">feed queries</text>

  <line x1="477" y1="460" x2="477" y2="264" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>

  <text x="306" y="540" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic">Device holds cloud credentials; API holds client registry only.</text>
  <text x="306" y="558" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic">Browser 140 is API-only (no direct cloud provider API).</text>
</svg>
