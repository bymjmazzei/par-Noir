<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792"
     viewBox="0 0 612 792" version="1.1">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="612" height="792" fill="#fff"/>
  <text x="28" y="26" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000">FIG. 10</text>
  <text x="100" y="26" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000">Public index membership alignment</text>
  <line x1="28" y1="34" x2="584" y2="34" stroke="#000" stroke-width="1"/>

  <rect x="40" y="60" width="160" height="52" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="120" y="80" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10">Owner publish</text>
  <text x="120" y="94" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10">→ cache 130</text>
  <text x="30" y="80" text-anchor="end" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">1000a</text>

  <rect x="226" y="60" width="160" height="52" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="306" y="80" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10">Explicit delete</text>
  <text x="306" y="94" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10">→ immediate purge</text>
  <text x="306" y="56" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">1000b</text>

  <rect x="412" y="60" width="160" height="52" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="492" y="80" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10">Public-content</text>
  <text x="492" y="94" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10">404/410 → purge</text>
  <text x="580" y="80" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">1000c</text>

  <rect x="120" y="140" width="372" height="48" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="306" y="158" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Owner-device reconcile</text>
  <text x="306" y="174" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">(forwarded cloud access token)</text>
  <text x="502" y="164" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">1002</text>

  <line x1="120" y1="112" x2="220" y2="140" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="306" y1="112" x2="306" y2="140" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="492" y1="112" x2="400" y2="140" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>

  <rect x="120" y="210" width="372" height="40" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="306" y="234" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Read public index 112 / verify blobs</text>
  <text x="502" y="234" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">1004</text>
  <line x1="306" y1="188" x2="306" y2="210" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>

  <polygon points="306,272 386,300 306,328 226,300" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="306" y="304" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10">Auth error?</text>
  <text x="396" y="280" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">1010</text>
  <line x1="306" y1="250" x2="306" y2="272" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>

  <rect x="40" y="285" width="120" height="36" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="307" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Skip user</text>
  <line x1="226" y1="300" x2="160" y2="303" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="185" y="290" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">yes</text>

  <polygon points="306,360 381,390 306,420 231,390" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="306" y="386" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10">Absent from</text>
  <text x="306" y="400" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10">index / missing?</text>
  <line x1="306" y1="328" x2="306" y2="360" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="320" y="345" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">no</text>

  <rect x="40" y="460" width="150" height="48" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="115" y="478" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Purge cache</text>
  <text x="115" y="492" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">rows</text>
  <text x="30" y="478" text-anchor="end" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">1006</text>

  <rect x="400" y="460" width="150" height="48" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="475" y="478" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Remove stale</text>
  <text x="475" y="492" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">file IDs</text>
  <text x="560" y="478" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">1008</text>

  <line x1="231" y1="390" x2="115" y2="390" stroke="#000" stroke-width="1.25"/>
  <line x1="115" y1="390" x2="115" y2="460" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="90" y="420" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">yes</text>
  <line x1="381" y1="390" x2="475" y2="390" stroke="#000" stroke-width="1.25"/>
  <line x1="475" y1="390" x2="475" y2="460" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="430" y="378" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="9">no / stale</text>

  <rect x="120" y="540" width="372" height="40" rx="4" ry="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="306" y="564" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11">Browser 140 reads cache 130 via API</text>
  <text x="502" y="564" text-anchor="start" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">1012</text>
  <!-- Route around 1012 into its top (do not drop vertically through the box) -->
  <polyline points="115,508 115,524 306,524 306,540"
            fill="none" stroke="#000" stroke-width="1.25" marker-end="url(#arrow)"/>
  <polyline points="475,508 475,524 306,524"
            fill="none" stroke="#000" stroke-width="1.25"/>

  <text x="306" y="620" text-anchor="middle" fill="#000" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic">Index 112 is membership truth. API holds no long-lived cloud OAuth secrets.</text>
</svg>
