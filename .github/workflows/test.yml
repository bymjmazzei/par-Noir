name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Secrets scan
        run: PN_STRICT_GUARDRAILS=1 bash scripts/check-secrets.sh

      - name: No backup files
        run: bash scripts/check-no-backup-files.sh

      - name: App import boundary
        run: bash scripts/check-app-import-boundary.sh

      - name: Quantum imports
        run: bash scripts/check-quantum-imports.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # `api/` is not a root workspace and links packages via `file:`, so it installs separately
      # and needs those packages built to `dist/` before Jest can resolve them.
      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Build packages the API imports
        run: npm run build:deps
        working-directory: api

      - name: Run tests
        run: npm test

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Dashboard
        run: npm run type-check
        working-directory: apps/id-dashboard

      - name: Aggregator browser
        run: npm run type-check
        working-directory: apps/aggregator-browser
