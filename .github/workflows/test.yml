name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Secrets scan
        run: PN_STRICT_GUARDRAILS=1 bash scripts/check-secrets.sh

      - name: No backup files
        run: bash scripts/check-no-backup-files.sh

      - name: App import boundary
        run: bash scripts/check-app-import-boundary.sh

      - name: Quantum imports
        run: bash scripts/check-quantum-imports.sh

      - name: Drive token resolver boundary
        run: PN_CHECK_ALL=1 bash scripts/check-token-resolver-boundary.sh

      - name: Drive token freshness boundary
        run: PN_CHECK_ALL=1 bash scripts/check-drive-token-freshness-boundary.sh

      - name: Owner fetch boundary
        run: PN_CHECK_ALL=1 bash scripts/check-owner-fetch-boundary.sh

      - name: Googleapis resolver import boundary
        run: PN_CHECK_ALL=1 bash scripts/check-googleapis-resolver-import.sh

      - name: OAuth unlock-proof boundary
        run: PN_CHECK_ALL=1 bash scripts/check-oauth-unlock-proof-boundary.sh

      - name: Passcode not on OAuth authenticate wire
        run: PN_CHECK_ALL=1 bash scripts/check-no-passcode-on-oauth-wire.sh

      - name: postMessage targetOrigin not wildcard
        run: PN_CHECK_ALL=1 bash scripts/check-postmessage-origin-boundary.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # `api/` is not a root workspace and links packages via `file:`, so it installs separately
      # and needs those packages built to `dist/` before Jest can resolve them.
      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Build packages the API imports
        run: npm run build:deps
        working-directory: api

      - name: Run tests
        run: npm test

      # Informational only — does not fail the job. No coverage gate until baselines are real.
      - name: API coverage report (informational)
        continue-on-error: true
        working-directory: api
        run: npx jest --coverage --coverageReporters=text-summary --coverageReporters=lcov --passWithNoTests

      - name: Upload API coverage (lcov)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-lcov
          path: api/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  e2e-smoke:
    name: E2E smoke (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # Chromium only: the smoke suite guards bundle boot, not cross-browser rendering.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/id-dashboard

      # VITE_API_ENDPOINT must be set at build time or the production bundle throws.
      - name: Build dashboard
        run: npm run build:e2e
        working-directory: apps/id-dashboard
        env:
          VITE_API_ENDPOINT: https://api.parnoir.com

      - name: Run dashboard smokes
        run: npm run test:e2e:smoke:prebuilt
        working-directory: apps/id-dashboard

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dashboard
          path: apps/id-dashboard/playwright-report
          retention-days: 7

  e2e-smoke-browser:
    name: E2E smoke (aggregator browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # Chromium only: the smoke suite guards bundle boot, not cross-browser rendering.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/aggregator-browser

      # VITE_API_ENDPOINT must be set at build time or the production bundle throws.
      - name: Build aggregator browser
        run: npm run build:e2e
        working-directory: apps/aggregator-browser
        env:
          VITE_API_ENDPOINT: https://api.parnoir.com

      - name: Run browser smokes
        run: npm run test:e2e:smoke:prebuilt
        working-directory: apps/aggregator-browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser
          path: apps/aggregator-browser/playwright-report
          retention-days: 7

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Dashboard
        run: npm run type-check
        working-directory: apps/id-dashboard

      - name: Aggregator browser
        run: npm run type-check
        working-directory: apps/aggregator-browser
