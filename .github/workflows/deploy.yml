name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html styles.css script.js CNAME .nojekyll site/
          cp manifest.json browserconfig.xml sitemap.xml site/ 2>/dev/null || true
          cp robots.txt developer-portal.html whitepaper.html privacy.html terms.html payment-gateway.html test.html offline.html site/ 2>/dev/null || true
          cp "parNoir Promo.mp4" site/ 2>/dev/null || true
          cp -r branding icons site/
          cp -r screenshots site/ 2>/dev/null || true
          mkdir -p site/licensing
          cp licensing/*.html site/licensing/ 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4